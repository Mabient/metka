name = "metka-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
BOT_USERNAME = "Metkadetect_bot"   # имя бота из BotFather, без @
APP_NAME = "app"                  # короткое имя Mini App из BotFather (/newapp)
WEBAPP_URL = "https://mabient.github.io/metka/"

[ai]
binding = "AI"   # распознавание того, что на фото (бесплатный лимит Cloudflare)

[[d1_databases]]
binding = "DB"
database_name = "metka"
database_id = "PASTE_DATABASE_ID"

# Единственный секрет — токен бота. Задаётся в панели Cloudflare:
#   Worker → Settings → Variables and Secrets → Add → Secret → BOT_TOKEN
# Таблицы базы создаются сами при первом запросе.
# После первого деплоя открыть https://metka-api.<поддомен>.workers.dev/setup — это подключит бота.
