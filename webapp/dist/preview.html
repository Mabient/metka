<title>Метка в Telegram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>/* Layout: full-height Telegram Mini App. Floating glass dock with five equal slots, the yellow "+" sticker sits in the exact centre slot.
   Cards are collectible specimens: photo first, a glass emoji chip and a rarity gem on top, the name set in a wide display face. */
:root{
  --bg:#0E1016; --s1:#171A23; --s2:#20242F; --s3:#2A2F3D; --ink:#F3F5FA; --mut:#8B93A7; --line:#272C39;
  --acc:#FFD43B; --acc-ink:#1C1500; --teal:#2EC4B6; --red:#FF5C6C; --glass:rgba(16,18,26,.62);
  --r-common:#9AA4B8; --r-rare:#4D8BFF; --r-epic:#A66BFF; --r-legend:#FFB020;
  --f-d:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-b:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sat:max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px));
  --sab:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --ctop:var(--tg-content-safe-area-inset-top,0px);
  --dock:72px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F4F8; --s1:#FFFFFF; --s2:#E9EDF3; --s3:#DCE2EB; --ink:#12151C; --mut:#5E6678; --line:#DFE4EC;
  --glass:rgba(255,255,255,.72); --r-common:#7D889C; --r-rare:#2F6FEB; --r-epic:#8A4BEB; --r-legend:#D98E00; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:12px}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--sat) + var(--ctop) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(var(--dock) + var(--sab) + 30px) max(16px,env(safe-area-inset-left,0px))}
.page{max-width:680px;margin:0 auto;display:grid;gap:18px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:8px;min-width:0}
.bar .logo{min-width:0}
.me-chip{display:flex;align-items:center;gap:8px;flex:none;padding:4px 12px 4px 4px;border-radius:999px;background:var(--s1);border:1px solid var(--line);box-shadow:0 3px 0 var(--s3)}
.me-chip .lv{display:grid;gap:4px;font-size:11px;color:var(--mut);text-align:left}
.me-chip .lv b{color:var(--ink);font-size:12px}
.xpbar{width:54px;height:4px;border-radius:4px;background:var(--s3);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:13px}
.logo{font-family:var(--f-d);font-weight:800;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.vpin{width:26px;height:auto;flex:none;image-rendering:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}

/* ---------- avatar ---------- */
.av{--sz:40px;width:var(--sz);height:var(--sz);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--sz)*.52);background:linear-gradient(140deg,var(--ca),var(--cb));flex:none;position:relative;line-height:1}
.av .st{position:absolute;right:-3px;bottom:-3px;width:calc(var(--sz)*.42);height:calc(var(--sz)*.42);min-width:16px;min-height:16px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font-size:calc(var(--sz)*.24);box-shadow:0 0 0 2px var(--bg)}

/* ---------- quest ---------- */
.quest{position:relative;overflow:hidden;border-radius:22px;padding:16px;background:radial-gradient(120% 140% at 100% 0%,rgba(255,212,59,.28),transparent 55%),linear-gradient(135deg,#232a3d,#171b26);color:#F3F5FA;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:1px solid rgba(255,255,255,.06)}
:root[data-theme="light"] .quest{background:radial-gradient(120% 140% at 100% 0%,rgba(255,212,59,.55),transparent 55%),linear-gradient(135deg,#2B3350,#1B2133)}
.quest .ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:28px}
.quest small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.quest b{display:block;font-size:15.5px;line-height:1.25;margin:2px 0 8px}
.qprog{display:flex;align-items:center;gap:10px;font-size:12px;color:#B9C0D0}
.qprog .t{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.qprog .t i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .5s}
.quest.done{background:linear-gradient(135deg,#1F6F5C,#174A43)}

/* ---------- segmented + chips ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{height:36px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--mut);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:13.5px;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);box-shadow:0 3px 0 #C9A11A}

/* ---------- tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;text-align:left;background:var(--s1);border-radius:20px;box-shadow:0 5px 0 var(--s2);overflow:hidden;border:1px solid var(--line);transition:transform .16s cubic-bezier(.2,.8,.2,1);min-width:0;position:relative}
.tile:active{transform:scale(.965)}
.tile .ph{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--s2);overflow:hidden}
.tile .chipe{position:absolute;left:8px;top:8px;height:32px;min-width:32px;padding:0 8px;border-radius:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;font-size:18px;z-index:2}
.gem{position:absolute;right:8px;top:8px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:9px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff}
.gem::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--rc);transform:rotate(45deg);box-shadow:0 0 8px var(--rc)}
.tile .dist{position:absolute;left:8px;bottom:8px;z-index:2;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--glass);color:#fff;backdrop-filter:blur(8px)}
.tile .lab{padding:10px 12px 12px;display:grid;gap:8px;min-width:0}
.tile .nm{font-family:var(--f-d);font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.tile .row2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);min-width:0}
.tile .row2 .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .row2 .av{--sz:20px}
.tile .row2 .av .st{display:none}
.r-common{--rc:var(--r-common)} .r-rare{--rc:var(--r-rare)} .r-epic{--rc:var(--r-epic)} .r-legend{--rc:var(--r-legend)}
.tile.r-rare,.tile.r-epic,.tile.r-legend{border-color:color-mix(in oklab,var(--rc) 45%,var(--line))}
.tile.r-legend::after,.tile.r-epic::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:20px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 47%,transparent 60%);background-size:260% 100%;animation:shine 3.6s ease-in-out infinite;mix-blend-mode:overlay;z-index:3}
@keyframes shine{0%{background-position:130% 0}55%,100%{background-position:-60% 0}}
.gen{position:absolute;inset:0;display:grid;place-items:center;font-size:62px;background:radial-gradient(120% 90% at 20% 10%,var(--g1),transparent 60%),radial-gradient(120% 100% at 90% 100%,var(--g2),transparent 65%),var(--g3)}
.gen span{filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sk{border-radius:20px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.2s linear infinite;aspect-ratio:4/6}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- empty ---------- */
.empty{display:grid;justify-items:center;text-align:center;gap:12px;padding:30px 10px}
.empty .big{font-size:56px}
.empty h3{font-family:var(--f-d);font-size:20px;margin:0;line-height:1.2;text-wrap:balance}
.empty p{margin:0;color:var(--mut);max-width:34ch}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + var(--sab)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.dock-in{pointer-events:auto;max-width:480px;margin:0 auto;height:var(--dock);border-radius:26px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);box-shadow:0 18px 40px -14px rgba(0,0,0,.55);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;font-size:10.5px;font-weight:700;color:var(--mut);transition:color .15s,transform .12s}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--acc)}
.tab:active{transform:scale(.9)}
.fabslot{display:grid;place-items:center;height:100%}
.fab{width:58px;height:58px;border-radius:16px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 6px 0 #C9A11A,0 18px 24px -10px rgba(255,180,0,.6);transition:transform .08s,box-shadow .08s}
.fab svg{width:28px;height:28px;display:block}
.fab:active{transform:translateY(-9px);box-shadow:0 1px 0 #C9A11A}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:640px;max-height:calc(100% - var(--sat) - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:28px 28px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + var(--sab)) max(16px,env(safe-area-inset-left,0px));animation:up .34s cubic-bezier(.2,.9,.2,1);border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--s3);margin:2px auto 14px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh-h h2{font-family:var(--f-d);font-weight:800;font-size:22px;margin:0;line-height:1.1}
.x{width:38px;height:38px;border-radius:13px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.full{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:slide .3s cubic-bezier(.2,.9,.2,1)}
@keyframes slide{from{transform:translateY(24px);opacity:0}}

/* ---------- form ---------- */
.field{display:grid;gap:8px}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.inp{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:15px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--teal)}
textarea.inp{resize:none;min-height:74px}
.form{display:grid;gap:18px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100px;border-radius:18px;border:1.5px dashed var(--s3);background:var(--s1);font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s}
.pick:active{transform:scale(.97)}
.pick svg{width:28px;height:28px;color:var(--acc)}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.preview{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:4/5;max-width:100%;max-height:380px;margin:0 auto;width:100%;background:var(--s2)}
.preview img{width:100%;height:100%;object-fit:cover;display:block}
.preview .again{position:absolute;right:10px;bottom:10px;background:var(--glass);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:700;padding:9px 13px;border-radius:12px;overflow:hidden}
.preview .again input{position:absolute;inset:0;opacity:0}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:7px;justify-content:center;height:46px;border-radius:15px;background:var(--s1);border:1px solid var(--line);font-weight:700;font-size:13.5px;transition:transform .12s}
.cat:active{transform:scale(.95)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.emg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.em{aspect-ratio:1;max-width:100%;border-radius:13px;font-size:22px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);transition:transform .12s}
.em:active{transform:scale(.86)}
.em[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);transform:scale(1.05)}
.em.locked{opacity:.35;filter:grayscale(1)}
.geo-row{display:flex;gap:8px}
.geo-row .inp{flex:1;min-width:0}
.geo-btn{flex:none;width:50px;border-radius:15px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center}
.geo-btn svg{width:22px;height:22px;color:var(--teal)}
.hint{font-size:12.5px;color:var(--mut)}
.ok{color:var(--teal);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 20px;border-radius:17px;font-weight:800;font-size:15.5px;transition:transform .12s,opacity .15s;text-decoration:none;color:inherit}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
/* voxel blocks: every primary control is an extruded cube that presses down */
.btn{border-radius:14px;transform:translateY(0);transition:transform .08s,box-shadow .08s,opacity .15s}
.btn.pri{background:var(--acc);color:var(--acc-ink);box-shadow:0 5px 0 #C9A11A,0 12px 18px -10px rgba(0,0,0,.6)}
.btn.dark{background:var(--ink);color:var(--bg);box-shadow:0 5px 0 var(--mut)}
.btn.soft{background:var(--s1);border:1px solid var(--line);box-shadow:0 4px 0 var(--s3)}
.btn.teal{background:var(--teal);color:#05211E;box-shadow:0 5px 0 #1D8A80,0 12px 18px -10px rgba(0,0,0,.6)}
.btn.danger{box-shadow:0 4px 0 var(--s3)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--s3)}
.btn.pri:active{box-shadow:0 1px 0 #C9A11A}
.btn.teal:active{box-shadow:0 1px 0 #1D8A80}
.btn.danger{background:var(--s1);border:1px solid var(--line);color:var(--red)}
.btn.w{width:100%}
.btn svg{width:20px;height:20px}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.sw{aspect-ratio:1;max-width:100%;border-radius:50%;background:linear-gradient(140deg,var(--ca),var(--cb));box-shadow:0 0 0 2px var(--bg);transition:transform .12s}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--ink);transform:scale(1.06)}

/* ---------- detail ---------- */
.det{max-width:520px;margin:0 auto;padding:calc(var(--sat) + var(--ctop) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(30px + var(--sab)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.det-top{display:flex;justify-content:space-between;align-items:center}
.stage{perspective:1000px}
.bigcard{position:relative;border-radius:26px;overflow:hidden;background:var(--s1);border:2px solid color-mix(in oklab,var(--rc) 65%,transparent);box-shadow:0 30px 60px -24px rgba(0,0,0,.65),0 0 40px -18px var(--rc);transition:transform .25s ease-out;transform-style:preserve-3d}
.bigcard .ph{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--s2);overflow:hidden}
.bigcard .gen{font-size:120px}
.glare{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.32),transparent 45%);mix-blend-mode:overlay}
.r-epic .glare,.r-legend .glare{background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.38),transparent 40%),conic-gradient(from calc(var(--ga,0)*1deg),rgba(255,0,128,.2),rgba(255,200,0,.2),rgba(0,255,170,.2),rgba(0,140,255,.2),rgba(200,0,255,.2),rgba(255,0,128,.2))}
.bigcard .num{position:absolute;left:12px;bottom:12px;z-index:4;font-size:12px;padding:6px 10px;border-radius:10px;background:var(--glass);color:#fff;backdrop-filter:blur(8px)}
.bigcard .gem{top:12px;right:12px;height:28px;font-size:11px;padding:0 10px}
.bigcard .chipe{position:absolute;left:12px;top:12px;z-index:4;width:48px;height:48px;border-radius:16px;background:var(--glass);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:28px}
.bigcard .body{padding:16px 18px 18px;display:grid;gap:12px}
.bigcard h1{font-family:var(--f-d);font-weight:800;font-size:26px;line-height:1.08;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.bigcard .story{margin:0;color:var(--mut)}
.owner{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:8px;margin:-8px;border-radius:16px}
.owner:active{background:var(--s2)}
.owner .ot b{display:block;font-size:14.5px}
.owner .ot span{font-size:12px;color:var(--mut)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px;padding-top:12px;border-top:1px dashed var(--s3)}
.spec dt{color:var(--mut);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.spec dd{margin:0;min-width:0;overflow-wrap:anywhere}
.reacts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rx{height:52px;border-radius:16px;background:var(--s1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:20px;transition:transform .12s}
.rx b{font-size:13px;font-family:var(--f-m)}
.rx:active{transform:scale(.88)}
.rx{box-shadow:0 4px 0 var(--s3)}
.rx:active{box-shadow:0 1px 0 var(--s3)}
.rx[aria-pressed="true"]{background:color-mix(in oklab,var(--acc) 22%,var(--s1));border-color:var(--acc);box-shadow:0 4px 0 #C9A11A}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .span{grid-column:1/-1}
.collectors{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.stack{display:flex}
.stack .av{--sz:30px;margin-left:-8px;box-shadow:0 0 0 2px var(--bg)}
.stack .av:first-child{margin-left:0}
.stack .av .st{display:none}
.collect{position:relative;overflow:hidden}
.collect .meter{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);transition:width .4s}

/* ---------- map ---------- */
.mapwrap{position:fixed;inset:0;z-index:1;background:var(--s2)}
.map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--s2);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px}
.map .tiles,.map .marks{position:absolute;inset:0}
.map .tiles img{position:absolute;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-100%);display:grid;justify-items:center;pointer-events:auto;transition:transform .15s}
.mk .stem{width:34px;height:auto;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.mk .bub{position:relative;z-index:1;margin-bottom:-12px;min-width:34px;height:34px;padding:0 4px;border-radius:10px;background:var(--s1);border:2.5px solid var(--rc);display:grid;place-items:center;font-size:19px;line-height:1;box-shadow:0 3px 0 var(--rc)}
.mk.sel{transform:translate(-50%,-100%) scale(1.18);z-index:5}
.mk.mine .bub{background:color-mix(in oklab,var(--acc) 30%,var(--s1))}
.mk.got .bub::after{content:"✓";position:absolute;right:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:var(--teal);color:#05211E;font-size:11px;font-weight:900;display:grid;place-items:center}
.medot{position:absolute;width:18px;height:18px;border-radius:50%;background:#3A86FF;border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 8px rgba(58,134,255,.25)}
.maptop{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(var(--sat) + var(--ctop) + 8px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.maptop > *{pointer-events:auto}
body.peeking .mapbtns{bottom:calc(var(--dock) + var(--sab) + 130px)}
.mapbtns{transition:bottom .25s;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dock) + var(--sab) + 26px);z-index:5;display:grid;gap:10px}
.mbtn{box-shadow:0 4px 0 var(--s3);width:48px;height:48px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:800}
.mbtn svg{width:22px;height:22px}
.peek{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dock) + var(--sab) + 24px);z-index:6;max-width:480px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:10px;border-radius:22px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);text-align:left;animation:up .25s ease}
.peek .ph{position:relative;width:64px;height:76px;border-radius:14px;overflow:hidden;flex:none;background:var(--s2)}
.peek .ph .gen{font-size:30px}
.peek .t{min-width:0;flex:1;display:grid;gap:3px}
.peek .t b{font-family:var(--f-d);font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.peek .t span{font-size:12px;color:var(--mut)}
.attr{position:fixed;left:8px;bottom:calc(var(--dock) + var(--sab) + 14px);z-index:4;font-size:9.5px;color:var(--mut);background:var(--glass);padding:2px 6px;border-radius:6px}
.attr a{color:inherit}

/* ---------- top ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;padding-top:8px}
.pod{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0}
.pod .av{--sz:58px}
.pod.p1 .av{--sz:76px}
.pod b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .ped{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:22px;color:var(--acc-ink)}
.pod.p1 .ped{height:96px;background:linear-gradient(180deg,#FFD43B,#FFB020)}
.pod.p2 .ped{height:70px;background:linear-gradient(180deg,#E4E9F2,#AEB8C8)}
.pod.p3 .ped{height:54px;background:linear-gradient(180deg,#FFC6A0,#E58A5A)}
.pod small{font-family:var(--f-m);font-size:12px;color:var(--mut)}
.lb{display:grid;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left;width:100%;min-width:0}
.lrow .rk{width:26px;text-align:center;font-family:var(--f-m);font-weight:700;color:var(--mut);flex:none}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t span{font-size:12px;color:var(--mut)}
.lrow .sc{font-family:var(--f-m);font-weight:700;font-size:14px;flex:none}
.lrow.me{border-color:var(--acc);background:color-mix(in oklab,var(--acc) 10%,var(--s1))}

/* ---------- profile ---------- */
.hero{position:relative;border-radius:28px;overflow:hidden;padding:22px 18px 18px;background:radial-gradient(140% 120% at 0% 0%,var(--ca),transparent 60%),radial-gradient(120% 120% at 100% 100%,var(--cb),transparent 60%),var(--s1);border:1px solid var(--line);display:grid;gap:14px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--s1) 100%);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero-row{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:96px;height:96px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .av{--sz:78px}
.ring .lvl{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.hero h2{font-family:var(--f-d);font-weight:800;font-size:22px;margin:0;line-height:1.1;overflow-wrap:anywhere}
.hero .stt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-top:6px;padding:5px 10px;border-radius:999px;background:var(--glass)}
.hero .bio{margin:0;font-size:14px;color:var(--mut)}
.xpline{display:grid;gap:6px;font-size:12px;color:var(--mut)}
.xpline .t{height:8px;border-radius:8px;background:var(--s3);overflow:hidden}
.xpline .t i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--acc),#FF8A3D)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;display:grid;gap:2px}
.stat b{font-family:var(--f-d);font-size:19px}
.stat span{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--mut)}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{display:flex;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.badge .i{font-size:24px;flex:none}
.badge b{display:block;font-size:13.5px}
.badge span{font-size:11.5px;color:var(--mut)}
.badge.off{opacity:.42;filter:grayscale(1)}
.sec{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:4px 2px -8px}

/* ---------- reveal ---------- */
.reveal{align-items:center;justify-content:center;flex-direction:column;gap:20px;background:rgba(4,6,10,.86);padding:20px}
.flip{width:min(290px,76vw);aspect-ratio:3/4;max-width:100%;position:relative;transform-style:preserve-3d;animation:flipin 1.1s cubic-bezier(.3,1.4,.4,1) .15s both}
@keyframes flipin{0%{transform:rotateY(180deg) scale(.55)}100%{transform:none}}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,var(--acc) 0 14px,#12151C 14px 28px);display:grid;place-items:center}
.face.back span{font-family:var(--f-d);font-weight:800;font-size:80px;color:var(--acc);background:#12151C;width:124px;height:124px;border-radius:50%;display:grid;place-items:center}
.face.front{background:var(--s1);border:3px solid var(--rc);display:flex;flex-direction:column;box-shadow:0 0 60px -10px var(--rc)}
.face.front .ph{position:relative;flex:1;background:var(--s2);overflow:hidden}
.face.front .lab{padding:12px 14px 14px;display:grid;gap:3px}
.face.front .nm{font-family:var(--f-d);font-weight:800;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.reveal h3{margin:0;font-family:var(--f-d);font-weight:800;font-size:26px;color:#fff;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.4,1) 1.1s both}
.reveal h3 em{font-style:normal;color:var(--rc);display:block}
.xpgain{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;animation:pop .45s ease 1.35s both}
.xpgain span{background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:999px}
.reveal .btn{animation:pop .4s ease 1.55s both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.burst{position:fixed;inset:0;pointer-events:none;z-index:90}

/* ---------- onboarding ---------- */
.onb{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto}
.onb-in{max-width:480px;margin:0 auto;padding:calc(var(--sat) + var(--ctop) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(24px + var(--sab)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:22px}
.onb h1{font-family:var(--f-d);font-weight:800;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.onb p.lead{margin:0;color:var(--mut);font-size:15.5px}
.onb .avbig{justify-self:center;--sz:120px;box-shadow:0 20px 50px -18px var(--ca);transition:background .3s}
.onb .avbig .st{display:none}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;top:calc(var(--sat) + var(--ctop) + 12px);transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center;animation:drop .3s cubic-bezier(.2,.9,.2,1)}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.demo-flag{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:8px;background:var(--s2);color:var(--mut)}
.qr-box{background:#fff;color:#12151C;border-radius:26px;padding:22px;display:grid;gap:12px;justify-items:center;text-align:center;width:min(340px,100%)}
.qr-box canvas{width:min(250px,68vw);height:auto;image-rendering:pixelated}
.qr-box .nm{font-family:var(--f-d);font-weight:800;font-size:18px;line-height:1.15}
.qr-box p{margin:0;font-size:13px;color:#5E6678;max-width:30ch}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- voxel diorama + parallax ---------- */
.px-in{position:absolute;inset:0;will-change:transform;transform:scale(1.14)}
.dio{position:relative;height:210px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#7FC8FF 0%,#BFE6FF 55%,#FFE7B3 100%);box-shadow:0 5px 0 var(--s2);isolation:isolate}
:root:not([data-theme="light"]) .dio{background:linear-gradient(180deg,#1A2350 0%,#3B3F7A 50%,#E7867A 100%)}
.dio::before{content:"";position:absolute;right:12%;top:14%;width:46px;height:46px;background:#FFE48A;box-shadow:0 0 50px 10px rgba(255,228,138,.6);border-radius:6px}
:root:not([data-theme="light"]) .dio::before{background:#F4F1FF;box-shadow:0 0 40px 6px rgba(244,241,255,.4);width:30px;height:30px}
.dio::after{content:"";position:absolute;inset:0 0 auto 0;height:62%;background:linear-gradient(180deg,rgba(10,12,30,.55),transparent);z-index:1;pointer-events:none}
.dio-stage{position:absolute;inset:0;display:grid;place-items:end center}
.dio-l{grid-area:1/1;width:min(100%,520px);height:auto;margin-bottom:-14px;will-change:transform;image-rendering:auto}
.dio-t{position:absolute;left:0;right:0;top:0;padding:16px 18px;display:grid;gap:2px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45);z-index:2;max-width:70%}
.dio-t small{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.dio-t b{font-family:var(--f-d);font-weight:800;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.dio-t span{font-size:12.5px;opacity:.9;max-width:30ch}
.dio.tall{height:240px;margin:0 -4px}
.dio.tall .dio-t{max-width:none}
.dio.tall .logo{font-size:24px}
.crate{width:110px;height:auto;filter:drop-shadow(0 12px 16px rgba(0,0,0,.4));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hero .hcr{position:absolute;z-index:0;width:56px;height:auto;opacity:.9;pointer-events:none}
.hero .hcr.a{right:16px;top:14px}
.hero .hcr.b{right:74px;top:46px;width:34px;opacity:.7}
.face.back{background:radial-gradient(circle at 50% 40%,#2A3150,#12151C)!important}
.face.back .crate{width:150px;animation:none}
.face.back span{position:absolute;inset:auto;background:none!important;width:auto!important;height:auto!important;font-size:54px!important;color:#12151C!important;text-shadow:0 0 0 #000;transform:translateY(8px)}
.rv-cr{width:64px;height:auto;animation:pop .5s cubic-bezier(.3,1.6,.4,1) 1s both,bob 3s ease-in-out 1.5s infinite;filter:drop-shadow(0 0 18px var(--rc))}

/* ---------- system patterns ---------- */
.pat{background-size:cover;background-position:center}
.photo-in{position:absolute;inset:9px;border-radius:14px;overflow:hidden;z-index:1;box-shadow:0 8px 18px -6px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.18)}
.bigcard .photo-in{inset:14px;border-radius:18px}
.face.front .photo-in{inset:10px;border-radius:14px}
.peek .photo-in{inset:4px;border-radius:10px}
.pat-e{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;z-index:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.bigcard .pat-e{font-size:120px}
.face.front .pat-e{font-size:84px}
.peek .pat-e{font-size:30px}
.patchip{display:inline-block;width:18px;height:18px;border-radius:5px;background-size:cover;vertical-align:-3px;margin-right:6px;box-shadow:0 0 0 1px var(--line)}

/* ---------- animated voxel stickers ---------- */
.vsticker{height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));will-change:transform}
.bounce{animation:vbounce 1.6s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes vbounce{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-14px) scale(.96,1.05)}55%{transform:translateY(0) scale(1.08,.92)}70%{transform:translateY(-4px) scale(1,1)}}
.wiggle{animation:wiggle .9s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}
.spop{position:fixed;left:50%;top:calc(var(--sat) + var(--ctop) + 60px);transform:translateX(-50%);z-index:110;display:grid;justify-items:center;gap:6px;padding:14px 22px 16px;border-radius:24px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 20px 40px -14px rgba(0,0,0,.6);animation:spin .5s cubic-bezier(.3,1.6,.4,1)}
.spop img{width:76px}
.spop b{font-family:var(--f-d);font-size:15px;white-space:nowrap}
.spop.out{transition:transform .4s,opacity .4s;opacity:0;transform:translate(-50%,-30px) scale(.8)}
@keyframes spin{from{transform:translateX(-50%) scale(.3) rotate(-20deg);opacity:0}}

/* ---------- cases ---------- */
.casepill{position:relative;box-shadow:0 3px 0 var(--s3)}
.casepill.ready::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.dailycase{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:12px 16px;border-radius:22px;background:linear-gradient(120deg,color-mix(in oklab,var(--acc) 30%,var(--s1)),var(--s1));border:1px solid color-mix(in oklab,var(--acc) 50%,var(--line));box-shadow:0 5px 0 #C9A11A}
.dailycase img{width:64px;flex:none}
.dailycase small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.dailycase b{display:block;font-family:var(--f-d);font-size:15px;line-height:1.2}
.dailycase span span{font-size:12.5px;color:var(--mut)}
.casehero{display:flex;align-items:center;gap:18px;justify-content:center;padding:18px;border-radius:26px;background:radial-gradient(120% 120% at 30% 20%,color-mix(in oklab,var(--acc) 26%,transparent),transparent 60%),var(--s1);border:1px solid var(--line)}
.casehero img{width:130px}
.casehero b{display:block;font-family:var(--f-d);font-size:46px;line-height:1}
.casehero span{color:var(--mut);font-weight:600}
.roul{position:relative;height:150px;border-radius:22px;overflow:hidden;background:var(--s1);border:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.rtrack{position:absolute;left:0;top:15px;display:flex;gap:10px;padding-left:10px;will-change:transform}
.rmark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--acc);box-shadow:0 0 14px var(--acc)}
.rmark::before,.rmark::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:8px solid transparent}
.rmark::before{top:0;border-top-color:var(--acc)}
.rmark::after{bottom:0;border-bottom-color:var(--acc)}
.citem{flex:none;width:100px;height:120px;border-radius:16px;background:linear-gradient(180deg,var(--s2),color-mix(in oklab,var(--rc) 22%,var(--s2)));border:2px solid color-mix(in oklab,var(--rc) 60%,transparent);display:grid;justify-items:center;align-content:center;gap:6px;padding:6px;text-align:center;box-shadow:inset 0 -5px 0 color-mix(in oklab,var(--rc) 45%,transparent)}
.citem .ce{font-size:38px;line-height:1}
.citem .ct{font-size:10.5px;font-weight:700;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.citem.won{animation:won .7s ease 2;box-shadow:0 0 30px var(--rc),inset 0 -5px 0 var(--rc)}
@keyframes won{50%{transform:scale(1.08)}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cgrid .citem{width:auto;height:112px}
.cgrid .citem:not(.own){opacity:.5;filter:saturate(.4)}
.cgrid .citem.own::after{content:"✓";position:absolute;margin:-48px 0 0 64px;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#05211E;font-size:12px;font-weight:900;display:grid;place-items:center}
.cgrid .citem{position:relative}
.cgrid .wearable{cursor:pointer}
.odds{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;font-weight:700}
.odds span{display:inline-flex;align-items:center;gap:6px;color:var(--rc)}
.odds i{width:9px;height:9px;border-radius:2px;background:var(--rc);transform:rotate(45deg)}
.win{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:color-mix(in oklab,var(--rc) 16%,var(--s1));border:2px solid var(--rc);box-shadow:0 0 40px -12px var(--rc);animation:pop .4s cubic-bezier(.3,1.6,.4,1)}
.win .we{font-size:52px;display:inline-block}
.win > div{flex:1;min-width:0;display:grid;gap:2px}
.win small{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.win b{font-family:var(--f-d);font-size:16px;line-height:1.2}
.win span{font-size:12.5px;color:var(--mut)}
.em.excl{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}

/* ---------- profile banners from cases ---------- */

// Minimal QR encoder: byte mode, ECC level M, versions 1–20.
const QR = (() => {
  const ECC_CPB = [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26];
  const NUM_BLK = [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16];
  const rawModules = v => { let r = (16*v+128)*v+64; if (v >= 2) { const n = Math.floor(v/7)+2; r -= (25*n-10)*n-55; if (v >= 7) r -= 36; } return r; };
  const dataCodewords = v => Math.floor(rawModules(v)/8) - ECC_CPB[v]*NUM_BLK[v];
  const gmul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z & 0xFF; };
  const rsDivisor = deg => { const r = new Array(deg).fill(0); r[deg-1] = 1; let root = 1; for (let i = 0; i < deg; i++) { for (let j = 0; j < r.length; j++) { r[j] = gmul(r[j], root); if (j+1 < r.length) r[j] ^= r[j+1]; } root = gmul(root, 2); } return r; };
  const rsRemainder = (data, div) => { const r = div.map(() => 0); for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gmul(c, f); }); } return r; };
  const bit = (x, i) => ((x >>> i) & 1) !== 0;

  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let ver = 1;
    for (; ver <= 20; ver++) { const cc = ver < 10 ? 8 : 16; if (4 + cc + bytes.length*8 <= dataCodewords(ver)*8) break; }
    if (ver > 20) throw new Error("Text too long for QR");
    const cap = dataCodewords(ver)*8;
    const bb = [];
    const push = (val, len) => { for (let i = len-1; i >= 0; i--) bb.push((val >>> i) & 1); };
    push(4, 4); push(bytes.length, ver < 10 ? 8 : 16); bytes.forEach(b => push(b, 8));
    push(0, Math.min(4, cap - bb.length)); push(0, (8 - bb.length % 8) % 8);
    for (let p = 0xEC; bb.length < cap; p ^= 0xEC ^ 0x11) push(p, 8);
    const data = []; for (let i = 0; i < bb.length; i += 8) { let v = 0; for (let j = 0; j < 8; j++) v = (v << 1) | bb[i+j]; data.push(v); }

    // ECC + interleave
    const nb = NUM_BLK[ver], el = ECC_CPB[ver], raw = Math.floor(rawModules(ver)/8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw/nb), div = rsDivisor(el);
    const blocks = []; let k = 0;
    for (let i = 0; i < nb; i++) { const d = data.slice(k, k + shortLen - el + (i < nShort ? 0 : 1)); k += d.length; const ecc = rsRemainder(d, div); if (i < nShort) d.push(0); blocks.push(d.concat(ecc)); }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - el || j >= nShort) cw.push(b[i]); });

    const size = ver*4 + 17;
    const mod = Array.from({length: size}, () => new Array(size).fill(false));
    const fn = Array.from({length: size}, () => new Array(size).fill(false));
    const set = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (x, y) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x+dx, yy = y+dy; if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size-4, 3); finder(3, size-4);
    let align = [];
    if (ver > 1) { const n = Math.floor(ver/7)+2, step = Math.ceil((ver*4+4)/(n*2-2))*2; align = [6]; for (let p = size-7; align.length < n; p -= step) align.splice(1, 0, p); }
    align.forEach((ax, i) => align.forEach((ay, j) => { const n = align.length; if ((i === 0 && j === 0) || (i === 0 && j === n-1) || (i === n-1 && j === 0)) return; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(ax+dx, ay+dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
    const drawFormat = mask => {
      const d = (0 << 3) | mask; let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412;
      for (let i = 0; i <= 5; i++) set(8, i, bit(b, i));
      set(8, 7, bit(b, 6)); set(8, 8, bit(b, 7)); set(7, 8, bit(b, 8));
      for (let i = 9; i < 15; i++) set(14-i, 8, bit(b, i));
      for (let i = 0; i < 8; i++) set(size-1-i, 8, bit(b, i));
      for (let i = 8; i < 15; i++) set(8, size-15+i, bit(b, i));
      set(8, size-8, true);
    };
    drawFormat(0);
    if (ver >= 7) { let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25); const b = (ver << 12) | r; for (let i = 0; i < 18; i++) { const a = size-11+i%3, c = Math.floor(i/3); set(a, c, bit(b, i)); set(c, a, bit(b, i)); } }

    let i = 0;
    for (let right = size-1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size-1-vert : vert;
        if (!fn[y][x] && i < cw.length*8) { mod[y][x] = bit(cw[i >>> 3], 7 - (i & 7)); i++; }
      }
    }
    const maskFn = [
      (x,y)=>(x+y)%2===0, (x,y)=>y%2===0, (x,y)=>x%3===0, (x,y)=>(x+y)%3===0,
      (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0, (x,y)=>x*y%2+x*y%3===0,
      (x,y)=>(x*y%2+x*y%3)%2===0, (x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && maskFn[m](x, y)) mod[y][x] = !mod[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let y = 0; y < size; y++) { let run = 1; for (let x = 1; x < size; x++) { if (mod[y][x] === mod[y][x-1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let x = 0; x < size; x++) { let run = 1; for (let y = 1; y < size; y++) { if (mod[y][x] === mod[y-1][x]) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1; } }
      for (let y = 0; y < size-1; y++) for (let x = 0; x < size-1; x++) { const c = mod[y][x]; if (c === mod[y][x+1] && c === mod[y+1][x] && c === mod[y+1][x+1]) p += 3; }
      mod.forEach(r => r.forEach(c => { if (c) dark++; }));
      return p + Math.floor(Math.abs(dark*20 - size*size*10) / (size*size)) * 10;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { applyMask(m); drawFormat(m); const p = penalty(); if (p < bestP) { bestP = p; best = m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return { size, get: (x, y) => mod[y][x] };
  }
  return { encode };
})();

function distM(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lon - a.lon);
  const s = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
// boost 0..1 — how unusual the thing in the photo is. Rare subjects shift the odds toward epic and legend.
function rollRarity(rand = Math.random(), boost = 0) {
  const b = Math.max(0, Math.min(1, boost));
  const w = { common: RARITY.common.w * (1 - .65 * b), rare: RARITY.rare.w * (1 + 1.2 * b), epic: RARITY.epic.w * (1 + 3 * b), legend: RARITY.legend.w * (1 + 7 * b) };
  const total = Object.values(w).reduce((a, x) => a + x, 0);
  let r = rand * total, acc = 0;
  for (const [k, v] of Object.entries(w)) { acc += v; if (r < acc) return k; }
  return "common";
}

function detectSubject(labels = []) {

    const name = String(l.label || "");
    for (const [re, e, ru, s] of SUBJECTS) if (re.test(name)) return { e, ru, s, conf: Math.round((l.score || 0) * 100), raw: name };
  }
  return null;
}

const RARE_TINT = { common: "#9AA4B8", rare: "#4D8BFF", epic: "#A66BFF", legend: "#FFB020" };
// Motif follows rarity (with a little luck), colour comes from the photo, emoji from what was seen.
function makePattern(rarity, emoji, tone, rand = Math.random) {
  const base = { common: "confetti", rare: "waves", epic: "stars", legend: "stars" }[rarity] || "confetti";
  const order = ["confetti", "waves", "stars"];
  let m = base;
  if (rarity !== "legend" && rand() < .18) m = order[Math.min(2, order.indexOf(base) + 1)];
  const c1 = /^#[0-9a-f]{6}$/i.test(tone || "") ? tone : PALETTE[Math.floor(rand() * PALETTE.length)];
  return { m, e: emoji, c1, c2: RARE_TINT[rarity] || "#9AA4B8", holo: rarity === "legend" };
}

/* ================= voxel engine =================
   Tiny isometric voxel renderer: models are lists of [x, y, z, color]. x goes right-down, y left-down, z up.
   Faces hidden by a neighbour are skipped, so models read as clean solid blocks. */
const VOX = (() => {
  const shade = (hex, k) => {
    const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = v => Math.max(0, Math.min(255, Math.round(k >= 1 ? v + (255 - v) * (k - 1) : v * k)));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  };
  function bounds(vox, s) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [x, y, z] of vox) {
      const sx = (x - y) * s, sy = (x + y) * s / 2 - z * s;
      minX = Math.min(minX, sx - s); maxX = Math.max(maxX, sx + s);
      minY = Math.min(minY, sy - s); maxY = Math.max(maxY, sy + s * 1.5);
    }
    return { minX, maxX, minY, maxY };
  }
  // Draws onto ctx with origin (ox, oy) = screen position of voxel (0,0,0).
  function draw(ctx, vox, s, ox, oy, opts = {}) {
    const set = new Set(vox.map(([x, y, z]) => `${x},${y},${z}`));
    const has = (x, y, z) => set.has(`${x},${y},${z}`);
    const list = [...vox].sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]) || a[2] - b[2]);
    const edge = opts.edge ?? .06;
    for (const [x, y, z, c] of list) {
      const cx = ox + (x - y) * s, cy = oy + (x + y) * s / 2 - z * s;
      const top = [[cx, cy - s / 2], [cx + s, cy], [cx, cy + s / 2], [cx - s, cy]];
      const poly = (pts, fill) => { ctx.beginPath(); pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); if (edge) { ctx.strokeStyle = `rgba(0,0,0,${edge})`; ctx.lineWidth = Math.max(.5, s * .04); ctx.stroke(); } };
      if (!has(x, y + 1, z)) poly([[cx - s, cy], [cx, cy + s / 2], [cx, cy + s * 1.5], [cx - s, cy + s]], shade(c, .62));
      if (!has(x + 1, y, z)) poly([[cx + s, cy], [cx, cy + s / 2], [cx, cy + s * 1.5], [cx + s, cy + s]], shade(c, .8));
      if (!has(x, y, z + 1)) poly(top, shade(c, 1.06));
    }
  }

  function canvas(vox, s, pad = 4, dpr = Math.min(3, window.devicePixelRatio || 1)) {
    const b = bounds(vox, s), w = b.maxX - b.minX + pad * 2, h = b.maxY - b.minY + pad * 2;
    const c = document.createElement("canvas"); c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr);
    c.style.width = w + "px"; c.style.height = h + "px";

  const url = (vox, s, pad) => canvas(vox, s, pad).toDataURL("image/png");

  function layers(models, s, pad = 6, dpr = Math.min(3, window.devicePixelRatio || 1)) {
    const b = bounds(models.flat(), s), w = b.maxX - b.minX + pad * 2, h = b.maxY - b.minY + pad * 2;
    return models.map(m => {
      const c = document.createElement("canvas"); c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr);
      const g = c.getContext("2d"); g.scale(dpr, dpr); g.lineJoin = "round";
      draw(g, m, s, -b.minX + pad, -b.minY + pad);
      return { url: c.toDataURL("image/png"), w, h };
    });
  }
  const cache = new Map();
  const cached = (key, fn) => { if (!cache.has(key)) cache.set(key, fn()); return cache.get(key); };

  /* ---------- models ---------- */
  const rnd = seed => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  function pin(color = "#FFD43B", hole = "#12151C") {
    const v = [];

    for (let x = 0; x < 5; x++) for (let y = 0; y < 5; y++) for (let z = 0; z < 5; z++) {
      const d = Math.hypot(x - 2, y - 2, z - 2); if (d <= 2.45) v.push([x, y, z + 3, (z >= 2 && z <= 2 && x === 4 && y === 2) ? hole : color]);
    }

    return v;
  }
  function shadeHex(hex, k) { const m = shade(hex, k).match(/\d+/g).map(Number); return "#" + m.map(n => n.toString(16).padStart(2, "0")).join(""); }
  function crystal(color) {
    const v = [];
    for (let z = 0; z < 7; z++) { const r = z < 3 ? z : 6 - z; for (let x = -r; x <= r; x++) for (let y = -r; y <= r; y++) if (Math.abs(x) + Math.abs(y) <= r) v.push([x + 3, y + 3, z, (x + y + z) % 3 === 0 ? shadeHex(color, 1.25) : color]); }
    return v;
  }
  function crate() {
    const v = [], Y = "#FFD43B", D = "#1E2230";
    for (let x = 0; x < 6; x++) for (let y = 0; y < 6; y++) for (let z = 0; z < 6; z++) {
      const edgeCount = (x === 0 || x === 5) + (y === 0 || y === 5) + (z === 0 || z === 5);
      if (edgeCount === 0) continue;
      v.push([x, y, z, edgeCount >= 2 ? Y : D]);
    }
    return v;
  }
  // Yalta diorama split into parallax layers.
  function diorama(seed = 7) {
    const R = rnd(seed), back = [], mid = [], front = [], N = 16;
    const SEA = ["#2B7BD8", "#3A8CE6", "#2468BF"], SAND = "#E9C97A", GRASS = ["#5DBB63", "#4FA857", "#6CC872"], ROCK = ["#8E96A8", "#7A8296", "#A2A9B8"];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
      // coastline: land on the back half (small y), sea on the front
      const coast = 6 + Math.round(Math.sin(x * .7) * 1.4 + Math.cos(x * .31) * 1.2);
      if (y > coast) { mid.push([x, y, 0, SEA[(x * 3 + y * 7) % 3]]); continue; }
      const land = y >= coast - 1 ? 1 : 2;
      for (let z = 0; z < land; z++) mid.push([x, y, z, y >= coast - 1 ? SAND : GRASS[(x + y + z) % 3]]);
      // mountains along the back
      const hgt = Math.max(0, Math.round((coast - 2 - y) * 1.6 + Math.sin(x * .9 + seed) * 1.5 + R() * 1.2));
      for (let z = land; z < land + hgt; z++) back.push([x, y, z, z > land + hgt - 2 && hgt > 4 ? "#F2F4F8" : ROCK[(x + z) % 3]]);
    }
    // cypress trees on the slope
    [[2, 4], [4, 3], [11, 4], [13, 3], [8, 2]].forEach(([x, y]) => { const h = 3 + (R() * 2 | 0); for (let z = 2; z < 2 + h; z++) mid.push([x, y, z, z === 2 ? "#6B4A2B" : "#2F7D44"]); mid.push([x, y, 2 + h, "#3C9655"]); });
    // lighthouse on the pier
    for (let z = 1; z < 8; z++) mid.push([12, 9, z, z % 2 ? "#FFFFFF" : "#FF5C6C"]);
    mid.push([12, 9, 8, "#FFD43B"], [12, 9, 9, "#FF5C6C"]);
    for (let y = 7; y < 10; y++) mid.push([12, y, 0, "#B9C0D0"]);
    // little boat
    [[5, 11], [6, 11], [7, 11]].forEach(([x, y]) => front.push([x, y, 1, "#FFFFFF"]));
    front.push([6, 11, 2, "#FF8A3D"], [6, 11, 3, "#FFFFFF"]);
    // ginger cat on the sand
    front.push([8, 6, 2, "#FF9F43"], [9, 6, 2, "#FF9F43"], [9, 6, 3, "#FFB86B"], [7, 6, 3, "#FF9F43"]);
    // floating pin above the town
    pin().forEach(([x, y, z, c]) => front.push([x + 5, y + 1, z + 9, c]));
    return { back, mid, front };
  }
  return { draw, canvas, url, layers, cached, pin, crystal, crate, diorama, shadeHex };
})();

/* ================= parallax ================= */
const PX = (() => {
  let tiltX = 0, tiltY = 0, raf = 0;
  const run = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(apply); };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function apply() {
    if (still) return;
    const sc = document.querySelector(".scroll");
    const st = sc ? sc.scrollTop : 0, vh = innerHeight;
    // layered dioramas: [data-depth] moves with scroll and tilt
    document.querySelectorAll("[data-depth]").forEach(el => {
      const d = +el.dataset.depth;
      el.style.transform = `translate3d(${(tiltX * d * 18).toFixed(1)}px, ${(st * d * .45 + tiltY * d * 12).toFixed(1)}px, 0)`;
    });
    // photos drift inside their frames
    document.querySelectorAll(".px-in").forEach(el => {
      const r = el.parentElement.getBoundingClientRect(); if (r.bottom < 0 || r.top > vh) return;
      const k = ((r.top + r.height / 2) / vh - .5);
      el.style.transform = `translate3d(${(tiltX * 6).toFixed(1)}px, ${(k * -18 + tiltY * 5).toFixed(1)}px, 0) scale(1.14)`;
    });
  }
  document.addEventListener("scroll", run, { capture: true, passive: true });
  window.addEventListener("resize", run);
  // device tilt (Telegram 8.0 API first, then the browser one), pointer on desktop
  const onTilt = (b, g) => { tiltX = Math.max(-1, Math.min(1, g / 30)); tiltY = Math.max(-1, Math.min(1, (b - 45) / 30)); run(); };
  function startTilt() {
    const DO = window.Telegram?.WebApp?.DeviceOrientation;
    if (DO && window.Telegram.WebApp.isVersionAtLeast?.("8.0")) {
      try { DO.start({ refresh_rate: 60 }, ok => { if (!ok) browserTilt(); }); window.Telegram.WebApp.onEvent("deviceOrientationChanged", () => onTilt((DO.beta || 0) * 57.3, (DO.gamma || 0) * 57.3)); return; } catch {}
    }
    browserTilt();
  }
  function browserTilt() { window.addEventListener("deviceorientation", e => { if (e.beta != null) onTilt(e.beta, e.gamma || 0); }, { passive: true }); }
  window.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; tiltX = (e.clientX / innerWidth - .5) * 2; tiltY = (e.clientY / innerHeight - .5) * 2; run(); }, { passive: true });
  if (!still) startTilt();
  return { refresh: run };
})();

        const xp = RARITY[m.rarity].collectXp; addXp(1, xp, "collect"); touch(); const questXp = claim(); save();

class SlippyMap {
  constructor(el, center, zoom) {
    this.el = el; this.tiles = el.querySelector(".tiles"); this.marksEl = el.querySelector(".marks");
    this.z = zoom; this.c = center; this.cache = new Map(); this.marks = []; this.me = null; this.sel = null;
    this.dark = document.documentElement.dataset.theme !== "light";
    this.ptrs = new Map(); this.raf = 0;
    this.onResize = () => this.draw(); window.addEventListener("resize", this.onResize);
    el.addEventListener("pointerdown", e => this.down(e)); el.addEventListener("pointermove", e => this.move(e));
    ["pointerup", "pointercancel", "pointerleave"].forEach(t => el.addEventListener(t, e => this.up(e)));
    el.addEventListener("wheel", e => { e.preventDefault(); this.zoomAt(-e.deltaY * .0025, e.offsetX, e.offsetY); }, { passive: false });
    el.addEventListener("dblclick", e => this.zoomAt(1, e.offsetX, e.offsetY));
    this.draw();
  }
  destroy() { window.removeEventListener("resize", this.onResize); cancelAnimationFrame(this.raf); cancelAnimationFrame(this.fly); }
  world(lat, lon, z = this.z) { const s = 256 * 2 ** z, sin = Math.sin(lat * Math.PI / 180); return { x: (lon + 180) / 360 * s, y: (.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * s }; }
  unworld(x, y, z = this.z) { const s = 256 * 2 ** z, lon = x / s * 360 - 180, n = Math.PI - 2 * Math.PI * y / s; return { lat: 180 / Math.PI * Math.atan(.5 * (Math.exp(n) - Math.exp(-n))), lon }; }
  size() { return { w: this.el.clientWidth, h: this.el.clientHeight }; }
  screen(lat, lon) { const { w, h } = this.size(), c = this.world(this.c.lat, this.c.lon), p = this.world(lat, lon); return { x: p.x - c.x + w / 2, y: p.y - c.y + h / 2 }; }
  draw() { cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(() => this._draw()); }
  _draw() {
    const { w, h } = this.size(), tz = Math.max(2, Math.min(19, Math.round(this.z))), k = 2 ** (this.z - tz), ts = 256 * k;
    const c = this.world(this.c.lat, this.c.lon, tz), cx = c.x * k, cy = c.y * k;
    const x0 = Math.floor((cx - w / 2) / ts), x1 = Math.floor((cx + w / 2) / ts), y0 = Math.floor((cy - h / 2) / ts), y1 = Math.floor((cy + h / 2) / ts), n = 2 ** tz;
    const want = new Set();
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      if (y < 0 || y >= n) continue;
      const wx = ((x % n) + n) % n, key = `${tz}/${wx}/${y}`; want.add(key);
      let img = this.cache.get(key);
      if (!img) { img = new Image(); img.decoding = "async"; img.alt = ""; img.src = `https://${"abcd"[(wx + y) % 4]}.basemaps.cartocdn.com/${this.dark ? "dark_all" : "rastertiles/voyager"}/${key}@2x.png`; img.onerror = () => { img.style.visibility = "hidden"; }; this.cache.set(key, img); this.tiles.appendChild(img); }
      img.style.width = img.style.height = ts + 1 + "px";
      img.style.transform = `translate(${Math.round(x * ts - cx + w / 2)}px,${Math.round(y * ts - cy + h / 2)}px)`;
    }
    for (const [key, img] of this.cache) if (!want.has(key)) { img.remove(); this.cache.delete(key); }
    for (const m of this.marks) { const p = this.screen(m.lat, m.lon); m._el.style.left = p.x + "px"; m._el.style.top = p.y + "px"; m._el.hidden = p.x < -60 || p.y < -60 || p.x > w + 60 || p.y > h + 80; }
    if (this.me) { const p = this.screen(this.me.lat, this.me.lon); this.meEl.style.left = p.x + "px"; this.meEl.style.top = p.y + "px"; }
  }
  setMarks(list, onPick) {
    this.marksEl.querySelectorAll(".mk").forEach(e => e.remove());
    this.marks = list.map(m => {
      const el = document.createElement("button"); el.className = `mk r-${m.rarity}${m.mine ? " mine" : ""}${m.got ? " got" : ""}`;
      el.setAttribute("aria-label", m.name); el.innerHTML = `<span class="bub">${esc(m.emoji)}</span><img class="stem" src="${VA.pin(RCOL[m.rarity])}" alt="">`;
      el.addEventListener("click", ev => { ev.stopPropagation(); H.pick(); this.marks.forEach(x => x._el.classList.remove("sel")); el.classList.add("sel"); onPick(m); });
      this.marksEl.appendChild(el); return { ...m, _el: el };
    });
    this.draw();
  }
  setMe(p) { this.me = p; if (!this.meEl) { this.meEl = document.createElement("div"); this.meEl.className = "medot"; this.marksEl.appendChild(this.meEl); } this.draw(); }
  down(e) { if (e.target.closest(".mk")) return; this.el.setPointerCapture?.(e.pointerId); this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); this.moved = false; cancelAnimationFrame(this.fly); }
  move(e) {
    if (!this.ptrs.has(e.pointerId)) return;
    const prev = this.ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
    if (this.ptrs.size === 1) {
      const dx = cur.x - prev.x, dy = cur.y - prev.y; if (Math.abs(dx) + Math.abs(dy) > 2) this.moved = true;
      const c = this.world(this.c.lat, this.c.lon); this.c = this.unworld(c.x - dx, c.y - dy);
    } else if (this.ptrs.size === 2) {
      const [a, b] = [...this.ptrs.entries()].map(([id, p]) => id === e.pointerId ? cur : p);
      const [pa, pb] = [...this.ptrs.values()];
      const d0 = Math.hypot(pa.x - pb.x, pa.y - pb.y), d1 = Math.hypot(a.x - b.x, a.y - b.y);
      if (d0 > 0) { const r = this.el.getBoundingClientRect(); this.zoomAt(Math.log2(d1 / d0), (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); }
      this.moved = true;
    }
    this.ptrs.set(e.pointerId, cur); this.draw();
  }
  up(e) { if (this.ptrs.delete(e.pointerId) && !this.moved && !this.ptrs.size && !e.target.closest?.(".mk")) { this.marks.forEach(x => x._el.classList.remove("sel")); showPeek(null); } }
  zoomAt(dz, sx, sy) {
    const nz = Math.max(3, Math.min(19, this.z + dz)); if (nz === this.z) return;
    const { w, h } = this.size(), c = this.world(this.c.lat, this.c.lon), pt = this.unworld(c.x + sx - w / 2, c.y + sy - h / 2);
    this.z = nz; const p2 = this.world(pt.lat, pt.lon); this.c = this.unworld(p2.x - sx + w / 2, p2.y - sy + h / 2); this.draw();
  }
  zoomBy(d) { const { w, h } = this.size(); H.pick(); this.animate(this.c, this.z + d, w / 2, h / 2); }
  flyTo(p, z) { this.animate(p, z); }
  animate(target, tz) {
    cancelAnimationFrame(this.fly); const s = { ...this.c }, sz = this.z, t0 = performance.now(), D = 450;
    const step = t => { const k = Math.min(1, (t - t0) / D), e = 1 - (1 - k) ** 3; this.c = { lat: s.lat + (target.lat - s.lat) * e, lon: s.lon + (target.lon - s.lon) * e }; this.z = Math.max(3, Math.min(19, sz + (tz - sz) * e)); this._draw(); if (k < 1) this.fly = requestAnimationFrame(step); };
    this.fly = requestAnimationFrame(step);
  }
}

function burst(r) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "burst"; document.body.appendChild(cv);
  const dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const cols = { rare: ["#4D8BFF", "#9CC0FF", "#fff", "#FFD43B"], epic: ["#A66BFF", "#E0B6FF", "#FFD43B"], legend: ["#FFB020", "#FFE48A", "#fff", "#FF8A3D"] }[r] || ["#FFD43B", "#fff"];
  const P = Array.from({ length: r === "legend" ? 160 : 90 }, () => ({ x: innerWidth / 2, y: innerHeight * .4, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 3, s: Math.random() * 7 + 3, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6 }));

}

  try { d = await api(`/api/marks/${code}`); } catch { popLayer(el); toast("Метка не найдена"); return; }
  const draw = () => {
    const m = d.mark, geo = hasGeo(m), dist = GEO.pos && geo ? distM(GEO.pos, m) : null;
    const canCollect = !d.mine && !d.collected;
    el.querySelector(".det").innerHTML = `
      <div class="det-top"><span class="lbl">Метка №${String(m.num).padStart(4, "0")}</span><button class="x" data-close aria-label="Закрыть">${ICON.x}</button></div>
      <div class="stage"><article class="bigcard r-${m.rarity}" id="bc">
        <div class="ph">${art(m)}<span class="chipe">${esc(m.emoji)}</span><span class="gem">${RARITY[m.rarity].t}</span><span class="num mono">${m.code}</span><div class="glare"></div></div>
        <div class="body"><h1>${esc(m.name)}</h1>${m.story ? `<p class="story">${esc(m.story)}</p>` : ""}
          <button class="owner" data-user="${m.owner.id}">${avatar(m.owner, 42)}<span class="ot"><b>${esc(m.owner.nick)}</b><span>Первооткрыватель · ур. ${m.owner.level}</span></span></button>
          <dl class="spec"><dt>Вид</dt><dd>${CAT[m.cat]?.e} ${CAT[m.cat]?.t}</dd><dt>Найдена</dt><dd>${fmtDate(m.at)}</dd>${m.place ? `<dt>Где</dt><dd>${esc(m.place)}</dd>` : ""}${dist != null ? `<dt>До неё</dt><dd>${fmtDist(dist)}</dd>` : ""}<dt>Собрали</dt><dd>${m.collects} ${plural(m.collects, "человек", "человека", "человек")}</dd>
          <dt>Узор</dt><dd><span class="patchip" style="background-image:url(${patternURL(patOf(m), m.code)})"></span>${PATTERNS[patOf(m).m].t}</dd>
          ${m.seen ? `<dt>ИИ увидел</dt><dd>${esc(m.seen.e)} ${esc(m.seen.ru)} · ${m.seen.conf}%</dd>` : ""}</dl>
        </div></article></div>
      <div class="reacts">${REACTIONS.map(e => `<button class="rx" data-rx="${e}" aria-pressed="${d.myReaction === e}">${e}${d.reactions[e] ? `<b>${d.reactions[e]}</b>` : ""}</button>`).join("")}</div>
      <div class="acts">
        ${canCollect ? `<button class="btn teal span collect" id="m-col"><span class="meter" style="width:${dist != null ? Math.max(0, Math.min(100, 100 - (dist - COLLECT_RADIUS_M) / 20)) : 0}%"></span><span style="position:relative">🧭 ${geo ? (dist != null ? (dist <= COLLECT_RADIUS_M ? "Собрать метку!" : `Собрать · подойди ближе (${fmtDist(dist)})`) : "Собрать метку") : "Собрать метку"}</span></button>` : ""}
        ${d.collected ? `<div class="btn soft span" style="pointer-events:none">✅ Метка в твоей коллекции</div>` : ""}
        ${geo ? `<button class="btn ${canCollect ? "soft" : "pri"} span" id="m-route">${ICON.route}Маршрут пешком</button>` : ""}
        <button class="btn soft" id="m-send">${ICON.send}Отправить</button>
        <button class="btn soft" id="m-qr">${ICON.qr}QR-код</button>
        ${m.photo && TG?.shareToStory ? `<button class="btn soft span" id="m-story">📲 В историю</button>` : ""}
        ${d.mine ? `<button class="btn danger span" id="m-del">Удалить метку</button>` : ""}
      </div>
      ${d.collectors.length ? `<div class="collectors"><div class="stack">${d.collectors.map(u => avatar(u, 30, false)).join("")}</div><span>Нашли: ${d.collectors.slice(0, 2).map(u => esc(u.nick)).join(", ")}${m.collects > 2 ? ` и ещё ${m.collects - 2}` : ""}</span></div>` : ""}`;
    $("[data-close]", el).onclick = () => popLayer(el);
    tilt($("#bc", el));
    $$("[data-rx]", el).forEach(b => b.onclick = async () => {
      H.pick(); const e = b.dataset.rx;
      try { const r = await api(`/api/marks/${m.code}/react`, { method: "POST", body: { emoji: e } }); d.reactions = r.reactions; d.myReaction = r.myReaction; draw(); if (r.myReaction) b.animate?.([{ transform: "scale(1.3)" }, { transform: "scale(1)" }], 250); } catch { toast("Не получилось"); }
    });
    $("#m-route", el)?.addEventListener("click", () => openLink(`https://yandex.ru/maps/?rtext=${GEO.pos ? `${GEO.pos.lat},${GEO.pos.lon}` : ""}~${m.lat},${m.lon}&rtt=pd`));
    $("#m-send", el).onclick = () => openTgLink(`https://t.me/share/url?url=${encodeURIComponent(appLink(m.code))}&text=${encodeURIComponent(`${m.emoji} Нашёл метку «${m.name}». Сможешь собрать?`)}`);
    $("#m-qr", el).onclick = () => showQr(m);
    $("#m-story", el)?.addEventListener("click", () => { try { TG.shareToStory(m.photo, { text: `${m.emoji} ${m.name} — найди меня в Метке`, widget_link: { url: appLink(m.code), name: "Открыть метку" } }); } catch { toast("Истории недоступны"); } });
    $("#m-col", el)?.addEventListener("click", async () => {
      const btn = $("#m-col", el); btn.disabled = true;
      let pos = null;
      if (geo) { pos = await getLocation(); if (!pos) { btn.disabled = false; H.err(); toast("Нужна геопозиция, чтобы собрать метку"); return; } }
      try {
        const r = await api(`/api/marks/${m.code}/collect`, { method: "POST", body: { ...(pos || {}), demoNear: DEMO } });
        const up = await refreshMe(); d.collected = true; d.mark.collects++; d.collectors.unshift({ id: S.me.id, nick: S.me.nick, avatar: S.me.avatar, color: S.me.color });
        H.seq(2); chime(1); burst(m.rarity === "common" ? "rare" : m.rarity);
        toast(`Собрано! +${r.xp} XP${r.questXp ? ` и задание дня +${r.questXp}` : ""}${up.levelUp ? ` · уровень ${up.levelUp}!` : ""}`, 3400);
        draw();
      } catch (e) {
        btn.disabled = false; H.err();
        toast({ too_far: `Ещё далеко: ${fmtDist(e.dist)}. Подойди ближе ${COLLECT_RADIUS_M} м`, already: "Уже в коллекции", own_mark: "Это твоя метка", need_location: "Нужна геопозиция" }[e.error] || "Не получилось собрать");
      }
    });
    const del = $("#m-del", el); let armed = false;
    del?.addEventListener("click", async () => {
      if (!armed) { armed = true; del.textContent = "Точно удалить? Нажми ещё раз"; H.err(); setTimeout(() => { if (armed && del.isConnected) { armed = false; del.textContent = "Удалить метку"; } }, 4000); return; }
      del.disabled = true;
      try { await api(`/api/marks/${m.code}`, { method: "DELETE" }); popLayer(el); await refreshMe(); renderTab(); toast("Метка удалена"); } catch { del.disabled = false; toast("Не получилось удалить"); }
    });
  };
  draw();
  if (hasGeo(d.mark) && !d.mine && !d.collected) getLocation().then(p => { if (p && el.isConnected) draw(); });
}
function tilt(card) {
  if (!card || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let raf = 0;
  const mv = (x, y) => { const r = card.getBoundingClientRect(), px = (x - r.left) / r.width, py = (y - r.top) / r.height; cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { card.style.transform = `rotateY(${(px - .5) * 14}deg) rotateX(${(.5 - py) * 14}deg)`; card.style.setProperty("--gx", px * 100 + "%"); card.style.setProperty("--gy", py * 100 + "%"); card.style.setProperty("--ga", Math.round(px * 360)); }); };
  card.addEventListener("pointermove", e => mv(e.clientX, e.clientY));
  card.addEventListener("touchmove", e => { const t = e.touches[0]; t && mv(t.clientX, t.clientY); }, { passive: true });
  const reset = () => { card.style.transform = ""; }; card.addEventListener("pointerleave", reset); card.addEventListener("touchend", reset);
}
function showQr(m) {
  const el = document.createElement("div"); el.className = "ov"; el.style.alignItems = "center"; el.style.padding = "20px";
  el.innerHTML = `<div class="qr-box" role="dialog" aria-label="QR-код метки"><div class="nm">${esc(m.emoji)} ${esc(m.name)}</div><div id="qrs"></div><span class="mono" style="font-size:13px">${m.code}</span><p>Друг наводит камеру телефона, и метка открывается прямо в Telegram.</p><button class="btn dark" id="qr-ok">Готово</button></div>`;
  pushLayer(el);
  const q = QR.encode(appLink(m.code)), px = 8, mg = 3, n = q.size + mg * 2, c = document.createElement("canvas"); c.width = c.height = n * px;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.fillStyle = "#12151C";
  for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.get(x, y)) g.fillRect((x + mg) * px, (y + mg) * px, px, px);
  $("#qrs", el).appendChild(c); H.ok();
  el.addEventListener("click", e => { if (e.target === el || e.target.id === "qr-ok") popLayer(el); });
}

/* ================= animated voxel stickers ================= */
function stickerPop(src, text) {
  const el = document.createElement("div"); el.className = "spop";
  el.innerHTML = `<img class="vsticker wiggle" src="${src}" alt=""><b>${esc(text)}</b>`;
  document.body.appendChild(el); H.ok(); chime(1);
  setTimeout(() => el.classList.add("out"), 2600); setTimeout(() => el.remove(), 3100);
}

/* ================= cases ================= */
const itemCard = (id, cls = "") => { const i = CASE_ITEM[id]; return `<div class="citem r-${i.r} ${cls}" data-item="${id}"><span class="ce">${i.e}</span><span class="ct">${esc(i.t)}</span></div>`; };
function openCases() {
  if (S.stack.some(x => x.el.classList.contains("cases-ov"))) return;
  const el = document.createElement("div"); el.className = "full cases-ov";
  pushLayer(el);
  const draw = () => {
    const c = S.cases, owned = new Set(S.items);
    el.innerHTML = `<div class="det">
      <div class="det-top"><span class="lbl">Кейсы</span><button class="x" data-close aria-label="Закрыть">${ICON.x}</button></div>
      <section class="casehero">
        <img class="vsticker float" src="${VA.crate()}" alt="">
        <div><b class="cnum mono">${c.count}</b><span>${plural(c.count, "кейс", "кейса", "кейсов")} у тебя</span></div>
      </section>
      <div class="roul" id="roul" hidden><div class="rtrack" id="rtrack"></div><div class="rmark"></div></div>
      <div id="rwin"></div>
      <div class="acts">
        ${c.dailyReady ? `<button class="btn teal span" id="c-daily">🎁 Забрать бесплатный кейс дня</button>` : `<div class="btn soft span" style="pointer-events:none">Следующий бесплатный кейс завтра</div>`}
        <button class="btn pri span" id="c-open" ${c.count ? "" : "disabled"}>Открыть кейс</button>
      </div>
      <p class="hint">Кейсы дают каждый день, за каждый новый уровень и за задание дня. Если выпадет то, что уже есть, получишь опыт.</p>
      <h3 class="sec">Что может выпасть</h3>
      <div class="odds">${[["common", 60], ["rare", 28], ["epic", 10], ["legend", 2]].map(([r, p]) => `<span class="r-${r}"><i></i>${RARITY[r].t} ${p}%</span>`).join("")}</div>
      <div class="cgrid">${CASE_ITEMS.map(i => itemCard(i.id, owned.has(i.id) ? "own" : "")).join("")}</div>
      <h3 class="sec">Мой инвентарь · ${S.items.length}</h3>
      ${S.items.length ? `<div class="cgrid">${S.items.map(id => itemCard(id, "own wearable")).join("")}</div>` : `<p class="hint">Пока пусто. Открой первый кейс!</p>`}
    </div>`;
    $("[data-close]", el).onclick = () => popLayer(el);
    $("#c-daily", el)?.addEventListener("click", async () => {
      try { const r = await api("/api/cases/daily", { method: "POST" }); S.cases = r.cases; H.ok(); stickerPop(VA.crate(), "Кейс дня получен!"); draw(); renderTab(); }
      catch { toast("Кейс дня уже забран"); }
    });
    $("#c-open", el)?.addEventListener("click", () => spin());
    $$(".wearable", el).forEach(card => card.addEventListener("click", () => wear(card.dataset.item)));
  };
  async function spin() {
    const btn = $("#c-open", el); btn.disabled = true; btn.textContent = "Крутим…"; $("#c-daily", el)?.setAttribute("disabled", "");
    let r;
    try { r = await api("/api/cases/open", { method: "POST" }); }
    catch { btn.disabled = false; btn.textContent = "Открыть кейс"; toast("Нет кейсов"); return; }
    const roul = $("#roul", el), track = $("#rtrack", el); roul.hidden = false; $("#rwin", el).innerHTML = "";
    track.innerHTML = r.strip.map(id => itemCard(id)).join("");
    const card = track.firstElementChild, step = card.getBoundingClientRect().width + 10;
    const W = roul.clientWidth, target = r.win * step + step / 2 - W / 2 + (Math.random() - .5) * step * .6;
    const D = matchMedia("(prefers-reduced-motion: reduce)").matches ? 300 : 6200, t0 = performance.now();
    let lastIdx = -1;
    await new Promise(done => {
      const frame = t => {
        const k = Math.min(1, (t - t0) / D), e = 1 - (1 - k) ** 4, x = target * e;
        track.style.transform = `translate3d(${-x}px,0,0)`;
        const idx = Math.floor((x + W / 2) / step);
        if (idx !== lastIdx) { lastIdx = idx; H.pick(); tick(); }
        k < 1 ? requestAnimationFrame(frame) : done();
      };
      requestAnimationFrame(frame);
    });
    const prize = CASE_ITEM[r.prize];
    track.children[r.win]?.classList.add("won");
    prize.r === "legend" ? H.seq(4) : prize.r === "epic" ? H.seq(2) : H.ok();
    chime({ common: 0, rare: 1, epic: 2, legend: 2 }[prize.r]); if (prize.r !== "common") burst(prize.r);
    await refreshMe();
    const wearable = prize.kind !== "xp" && !r.duplicate;
    $("#rwin", el).innerHTML = `<div class="win r-${prize.r}"><span class="we bounce">${prize.e}</span><div><small>${RARITY[prize.r].t}</small><b>${esc(prize.t)}</b><span>${r.duplicate ? `Уже было в инвентаре → +${r.xp} XP` : prize.kind === "xp" ? "Опыт начислен" : "Добавлено в инвентарь"}${r.levelUps ? ` · новый уровень! +${r.levelUps} 🎁` : ""}</span></div>${wearable ? `<button class="btn pri" id="c-wear">Надеть</button>` : ""}</div>`;
    $("#c-wear", el)?.addEventListener("click", () => wear(prize.id));
    const keep = $("#rwin", el).innerHTML;
    setTimeout(() => { if (!el.isConnected) return; const roulHTML = roul.outerHTML; draw(); $("#roul", el).outerHTML = roulHTML; $("#rwin", el).innerHTML = keep; $("#c-wear", el)?.addEventListener("click", () => wear(prize.id)); }, 1400);
  }
  async function wear(id) {
    const i = CASE_ITEM[id]; if (!i || i.kind === "xp") return;
    const body = { ...S.me, banner: S.me.banner || "" };
    if (i.kind === "avatar") body.avatar = i.v; if (i.kind === "status") body.status = i.v; if (i.kind === "banner") body.banner = i.v;
    try { await api("/api/me", { method: "POST", body }); await refreshMe(); H.ok(); stickerPop(VA.crystal({ common: "#9AA4B8", rare: "#4D8BFF", epic: "#A66BFF", legend: "#FFB020" }[i.r]), `${i.e} Надето!`); renderTab(); }
    catch { toast("Не получилось надеть"); }
  }
  draw();
}
function tick() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(); o.type = "square"; o.frequency.value = 1800 + Math.random() * 200; o.connect(g); g.connect(actx.destination);
    const s = actx.currentTime; g.gain.setValueAtTime(.03, s); g.gain.exponentialRampToValueAtTime(.0001, s + .03); o.start(s); o.stop(s + .04);
  } catch {}
}

/* ================= boot ================= */
function boot2() {
  const sp = TG?.initDataUnsafe?.start_param || "", qs = new URLSearchParams(location.search);
  const code = sp.startsWith("m_") ? sp.slice(2) : (qs.get("m") || "");
  setTab(qs.get("tab") === "top" ? "top" : "feed");
  if (qs.get("tab") === "cases") openCases();

}
new MutationObserver(() => PX.refresh()).observe(document.body, { childList: true, subtree: true });
(async function boot() {
  view.innerHTML = `<div class="scroll"><div class="page"><div class="sk" style="aspect-ratio:4/1"></div><div class="grid"><div class="sk"></div><div class="sk"></div></div></div></div>`;
  try { await refreshMe(); }
  catch (e) { view.innerHTML = `<div class="scroll"><div class="empty" style="padding-top:30vh"><div class="big">📡</div><h3>${e.error === "unauthorized" ? "Открой Метку через Telegram" : "Нет связи с сервером"}</h3><p>${e.error === "unauthorized" ? "Приложение работает внутри бота." : "Проверь интернет и открой приложение снова."}</p></div></div>`; return; }
  if (!S.me.onboarded) openEditProfile(true); else boot2();
})();
